<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Meniscus Software Architecture</title>
  <desc id="desc">Balanced architecture diagram for the Meniscus Unity project with grouped subsystems and key class names.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px Arial, sans-serif; fill: #475569; }
      .node { stroke-width: 2.4; rx: 18; }
      .node-title { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .node-sub { font: 15px Arial, sans-serif; fill: #475569; }
      .node-list { font: 14px Arial, sans-serif; fill: #334155; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.8; marker-end: url(#arrow); }
      .event { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); stroke-dasharray: 8 7; }
      .label { font: 14px Arial, sans-serif; fill: #334155; }
      .unity { fill: #e0f2fe; stroke: #0284c7; }
      .runtime { fill: #dcfce7; stroke: #16a34a; }
      .core { fill: #fef3c7; stroke: #d97706; }
      .gameplay { fill: #ede9fe; stroke: #7c3aed; }
      .presentation { fill: #fae8ff; stroke: #c026d3; }
      .ui { fill: #ffe4e6; stroke: #e11d48; }
      .audio { fill: #e0e7ff; stroke: #4f46e5; }
      .assets { fill: #f1f5f9; stroke: #64748b; }
      .tests { fill: #ecfeff; stroke: #0891b2; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="900"/>
  <text class="title" x="750" y="58" text-anchor="middle">Meniscus Software Architecture</text>
  <text class="subtitle" x="750" y="88" text-anchor="middle">Balanced view: grouped enough to read quickly, detailed enough to show the real software shape.</text>

  <!-- Project inputs -->
  <rect class="node assets" x="95" y="135" width="270" height="88"/>
  <text class="node-title" x="230" y="168" text-anchor="middle">Art Assets</text>
  <text class="node-sub" x="230" y="194" text-anchor="middle">Blender, FBX, materials</text>

  <rect class="node unity" x="465" y="125" width="270" height="98"/>
  <text class="node-title" x="600" y="160" text-anchor="middle">Unity Scene</text>
  <text class="node-sub" x="600" y="186" text-anchor="middle">Saloon.unity</text>
  <text class="node-sub" x="600" y="207" text-anchor="middle">scene objects + serialized links</text>

  <rect class="node runtime" x="765" y="125" width="270" height="98"/>
  <text class="node-title" x="900" y="160" text-anchor="middle">Meniscus.Runtime</text>
  <text class="node-sub" x="900" y="186" text-anchor="middle">custom gameplay assembly</text>
  <text class="node-sub" x="900" y="207" text-anchor="middle">Unity, UI, Input, Wwise refs</text>

  <rect class="node tests" x="1135" y="135" width="270" height="88"/>
  <text class="node-title" x="1270" y="168" text-anchor="middle">EditMode Tests</text>
  <text class="node-sub" x="1270" y="194" text-anchor="middle">game flow, economy, visuals</text>

  <!-- Central orchestration -->
  <rect class="node core" x="570" y="335" width="360" height="120"/>
  <text class="node-title" x="750" y="374" text-anchor="middle">GameManager</text>
  <text class="node-sub" x="750" y="403" text-anchor="middle">central match, round, turn, and state hub</text>
  <text class="node-list" x="750" y="430" text-anchor="middle">starts rounds, resolves drops, drives phases</text>

  <!-- Runtime groups -->
  <rect class="node gameplay" x="95" y="315" width="330" height="150"/>
  <text class="node-title" x="260" y="352" text-anchor="middle">Gameplay Controllers</text>
  <text class="node-list" x="260" y="385" text-anchor="middle">PlayerController</text>
  <text class="node-list" x="260" y="411" text-anchor="middle">EnemyAI</text>
  <text class="node-list" x="260" y="437" text-anchor="middle">Coin, CameraController</text>

  <rect class="node core" x="95" y="575" width="330" height="150"/>
  <text class="node-title" x="260" y="612" text-anchor="middle">Core Systems</text>
  <text class="node-list" x="260" y="645" text-anchor="middle">GlassManager</text>
  <text class="node-list" x="260" y="671" text-anchor="middle">EconomyManager</text>
  <text class="node-list" x="260" y="697" text-anchor="middle">GameConstants, RoundResolver</text>

  <rect class="node presentation" x="585" y="575" width="330" height="150"/>
  <text class="node-title" x="750" y="612" text-anchor="middle">Presentation</text>
  <text class="node-list" x="750" y="645" text-anchor="middle">CoinDropPresentationController</text>
  <text class="node-list" x="750" y="671" text-anchor="middle">GlassVisualController</text>
  <text class="node-list" x="750" y="697" text-anchor="middle">drop animation, water, spill feedback</text>

  <rect class="node ui" x="1075" y="315" width="330" height="150"/>
  <text class="node-title" x="1240" y="352" text-anchor="middle">Runtime UI</text>
  <text class="node-list" x="1240" y="385" text-anchor="middle">SaloonHudController</text>
  <text class="node-list" x="1240" y="411" text-anchor="middle">ShopManager</text>
  <text class="node-list" x="1240" y="437" text-anchor="middle">EndScreenManager</text>

  <rect class="node audio" x="1075" y="575" width="330" height="150"/>
  <text class="node-title" x="1240" y="612" text-anchor="middle">Audio</text>
  <text class="node-list" x="1240" y="645" text-anchor="middle">AK.Wwise.Event posts</text>
  <text class="node-list" x="1240" y="671" text-anchor="middle">Meniscus_WwiseProject</text>
  <text class="node-list" x="1240" y="697" text-anchor="middle">coin, splash, spill soundbanks</text>

  <!-- Top flow -->
  <path class="edge" d="M365 179 L465 179"/>
  <path class="edge" d="M735 174 L765 174"/>
  <path class="edge" d="M900 223 C900 270, 820 300, 780 335"/>
  <path class="event" d="M1135 179 C1040 220, 980 270, 890 335"/>

  <!-- Main runtime relationships -->
  <path class="edge" d="M425 390 L570 390"/>
  <text class="label" x="495" y="372" text-anchor="middle">actions</text>

  <path class="edge" d="M620 455 C500 510, 415 575, 395 650"/>
  <text class="label" x="500" y="548" text-anchor="middle">rules + results</text>

  <path class="event" d="M750 455 L750 575"/>
  <text class="label" x="788" y="523">drop + risk events</text>

  <path class="event" d="M930 390 L1075 390"/>
  <text class="label" x="1002" y="372" text-anchor="middle">state updates</text>

  <path class="edge" d="M1075 425 C1000 455, 965 455, 930 415"/>
  <text class="label" x="1006" y="461" text-anchor="middle">shop / restart</text>

  <path class="event" d="M915 650 L1075 650"/>
  <text class="label" x="995" y="632" text-anchor="middle">sound triggers</text>

  <path class="event" d="M930 430 C1015 515, 1070 580, 1075 650"/>

  <!-- Legend -->
  <rect x="480" y="800" width="540" height="55" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="520" y1="828" x2="590" y2="828" class="edge"/>
  <text class="label" x="610" y="833">direct control / dependency</text>
  <line x1="790" y1="828" x2="860" y2="828" class="event"/>
  <text class="label" x="880" y="833">events / validation / audio</text>
</svg>
